[package]
name = "alephvault_evm_gdextension"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
alloy-consensus = "2"
alloy-dyn-abi = "1"
alloy-eips = "2"
alloy-json-abi = "1"
alloy-primitives = "1"
alloy-signer = { version = "2", features = ["eip712"] }
alloy-signer-local = { version = "2", features = ["keystore"] }
godot = "0.2"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rand = "0.8"
serde_json = "1"
tiny-keccak = { version = "2", features = ["keccak"] }
ureq = { version = "2", features = ["json"] }
